# يطبّق ترحيلات قاعدة البيانات ودوال الخادم على مشروع Supabase للإصدار 2 (lamsat-v2).
# يعمل عند كل تحديث للفرع main يمسّ مجلد supabase، أو يدويًا من صفحة Actions.
# يحتاج سرّين في إعدادات المستودع: SUPABASE_ACCESS_TOKEN و SUPABASE_DB_PASSWORD. بدونهما يتخطى التطبيق ولا يفشل.
name: db-v2
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/db-v2.yml']
  workflow_dispatch:
env:
  PROJECT_REF: aadhppkwtmhyagljopcv
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set; skipping database apply."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with: { version: latest }
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --linked --include-all --yes
      - name: Deploy edge functions
        if: steps.secrets.outputs.ready == 'true'
        run: |
          supabase functions deploy admin-users --project-ref "$PROJECT_REF" --yes
          supabase functions deploy notify-worker --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy first-setup --project-ref "$PROJECT_REF" --no-verify-jwt --yes
